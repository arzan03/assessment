name: CI/CD for Yii2 App

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest

      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy to EC2
        run: |
            ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
                set -e

                echo "Checking Docker Swarm status..."
                if ! docker info | grep -q "Swarm: active"; then
                echo "Swarm not initialized. Initializing..."
                docker swarm init
                else
                echo "Swarm already initialized."
                fi

                echo "Pulling new image..."
                docker pull ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest

                echo "Checking if service exists..."
                if docker service ls | grep -q ${{ secrets.APP_NAME }}; then
                echo "Service exists. Backing up current image digest..."
                OLD_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest || true)

                echo "Updating service..."
                docker service update \
                    --image ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest \
                    --force ${{ secrets.APP_NAME }}

                echo "Waiting for deployment to stabilize..."
                sleep 10

                if ! docker service ps ${{ secrets.APP_NAME }} --no-trunc --filter 'desired-state=shutdown' | grep -q "Exit 0"; then
                    echo "Deployment failed. Rolling back..."
                    if [ -n "$OLD_DIGEST" ]; then
                    docker service update --image "$OLD_DIGEST" --force ${{ secrets.APP_NAME }}
                    else
                    echo "No previous digest found. Manual rollback required."
                    fi
                    exit 1
                fi

                echo "Service update successful."
                else
                echo "Creating new service..."
                docker service create \
                    --name ${{ secrets.APP_NAME }} \
                    -p 8080:8080 \
                    ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest
                fi
            EOF